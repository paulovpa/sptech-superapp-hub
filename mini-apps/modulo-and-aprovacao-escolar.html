<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovação Escolar: Notas e Frequência Fazem a Diferença!</title>
</head>
<body>
    <h1>Aprovação Escolar: Notas e Frequência Fazem a Diferença!</h1>
    <label for="input_nota">Qual foi a nota?</label>
    <input type="text" id="input_nota"><br>
    <label for="input_freq">Qual foi a frequência?</label>
    <input type="text" id="input_freq"><br>
    <button onclick="verificar()">Avaliar aluno</button>
</body>
</html>
<script>
    function verificar() {
        let nota = Number(input_nota.value);
        let freq = Number(input_freq.value);

        if (nota>=6 && freq >=75) {
            alert('Parabéns! Aprovado!');
        } else {
            alert('Infelizmente, não foi desta vez');
        }
    }
</script>
