<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforto Térmico: A Temperatura Está Ideal?</title>
</head>
<body>
    <h1>Conforto Térmico: A Temperatura Está Ideal?</h1>
    <label for="input_temp">Qual a temperatura atual?</label>
    <input type="text" id="input_temp">
    <button onclick="verificar()">Ver Situação</button>    
</body>
</html>
<script>
    function verificar() {
        let temp = Number(input_temp.value);

        if (temp>=21 && temp<=24) { // VERIFICAR ERRO
            alert('Temperatura confortável :D')
        } else {
            alert('Temperatura DESCONFORTÁVEL :C')
        }
    }
</script>
