<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutas Preferidas</title>
</head>
<body>
    <h1>Juliane Joada e Suas Frutas Preferidas</h1>
    <label for="input_fruta">Qual fruta chegou a mesa</label>
    <input type="text" id="input_fruta">
    <button onclick="verificar()">Vai comer?</button>
</body>
</html>
<script>
    function verificar() {
        let fruta = input_fruta.value;

        if (fruta =='Uva' || fruta =='Abacaxi') {
            alert(`Sim, vai comer ${fruta}`);
        } else {
            alert(`A fruta ${fruta} ela não come`);
        }
       
    }
</script>
