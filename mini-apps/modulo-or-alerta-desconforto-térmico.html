<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Desconforto Térmico</title>
</head>
<body>
    <h1>Alerta de Desconforto Térmico</h1>
    <label for="input_temp">Qual a temperatura atual?</label>
    <input type="text" id="input_temp"><br>
    <button onclick="verificar()">Analisar clima</button>

</body>
</html>
<script>
    function verificar() {
        let temp = Number(input_temp.value);

        if (temp <21 || temp >24) {
            alert('Alerta de desconforto!');
            if (temp <21) {
                alert('As pessoas vão ter hipotermia');
            } else if (temp >24) {
                alert('As pessoas vão derreter')
            }
        }
    }
</script>
