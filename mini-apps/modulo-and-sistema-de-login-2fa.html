<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Seguro: Verificação em Duas Etapas!</title>
</head>
<body>
    <h1>Login Seguro: Verificação em Duas Etapas!</h1>

    <label for="input_login">Login:</label>
    <input type="text" id="input_login"><br>
    <label for="input_senha">Senha:</label>
    <input type="password" id="input_senha"><br>
    <label for="input_cod">Código de Segurança</label>
    <input type="text" id="input_cod"><br>
    <button onclick="autenticar()">Entrar</button>
</body>
</html>
<script>
    function autenticar(){
        let login = input_login.value;
        let senha = input_senha.value;
        let cod = input_cod.value;

        if (login=='SPTech' && senha=='digital' && cod=='123') {
            alert('Usuário autenticado com sucesso');
        } else {
            alert('Falha na autenticação');
        }
    }
</script>
