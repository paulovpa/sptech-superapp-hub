<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo Seletivo Mentes Brilhantes</title>
</head>
<body>
    <h1>Processo Seletivo Mentes Brilhantes</h1>
    <label for="input_notaenem">Qual a nota do ENEM?</label>
    <input type="text" id="input_notaenem"><br>
    <label for="input_notaenem">Qual a nota do vestibular interno?</label>
    <input type="text" id="input_vestibular"><br>
    <button onclick="verificar()">Avaliação</button>
</body>
</html>
<script>
    function verificar(){
        let enem = Number(input_notaenem.value);
        let vestibular = Number(input_vestibular.value);

        if (enem >=800 || vestibular>=700) {
            alert('Parabéns! Aprovado');
        } else {
            alert('Tente semestre que vem');
        }
    }
</script>
