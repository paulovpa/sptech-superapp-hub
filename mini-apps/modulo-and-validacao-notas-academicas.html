<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Notas</title>
</head>
<body>
    <h1>Validação de Notas: Seu Resultado é Aceitável?</h1>
    <label for="input_nota">Qual foi a nota?</label>
    <input type="text" id="input_nota"><br>
    <button onclick="verificar()">Avaliar aluno</button>
</body>
</html>
<script>
    function verificar() {
        let nota = Number(input_nota.value);

        if (nota>=0 && nota<=10) {
            alert('Nota válida!')
        } else {
            alert('Onde já se viu nota menor que 0 e maior que 10?!')
        }
    }
</script>
